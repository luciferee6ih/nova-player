output: dist/

releases:
  - name: dev
    display_name: NOVA Player
    jobs:
      - name: linux-deb
        package:
          platform: linux
          target: deb
        # Override the package name specifically for Debian to satisfy the hyphen rule
        # while keeping the internal project name as nova_player for Dart compatibility.
        maker_config:
          package_name: nova-player
        build_args:
          --release:

      - name: linux-rpm
        package:
          platform: linux
          target: rpm
        build_args:
          --release:

      - name: linux-appimage
        package:
          platform: linux
          target: appimage
        build_args:
          --release:

      - name: linux-archive
        package:
          platform: linux
          target: archive
        build_args:
          --release:

