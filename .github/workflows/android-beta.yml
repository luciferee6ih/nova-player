name: Android Beta APK

# Builds the NOVA Player Android APKs on every push to main and publishes
# them to the "v1.0.0-beta" pre-release. On the first run it creates a
# permanent signing key and stores it as repository secrets (needs the
# NOVA_PAT secret: a token with repo + workflow scopes).

# Manual only, to save Actions minutes; releases go through release.yml.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-beta
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.7'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Signing key (create once, then reuse)
        env:
          GH_TOKEN: ${{ secrets.NOVA_PAT }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          umask 077
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "No signing key yet: creating one"
            KEYSTORE_PASSWORD=$(openssl rand -hex 24)
            KEY_ALIAS=nova
            keytool -genkeypair -keystore android/app/release.keystore -storetype PKCS12 \
              -alias "$KEY_ALIAS" -keyalg RSA -keysize 4096 -validity 10000 \
              -storepass "$KEYSTORE_PASSWORD" -keypass "$KEYSTORE_PASSWORD" \
              -dname "CN=NOVA Player, O=theluciferee"
            if [ -n "$GH_TOKEN" ]; then
              base64 -w0 android/app/release.keystore | gh secret set KEYSTORE_BASE64 -R "$GITHUB_REPOSITORY"
              printf '%s' "$KEYSTORE_PASSWORD" | gh secret set KEYSTORE_PASSWORD -R "$GITHUB_REPOSITORY"
              printf '%s' "$KEYSTORE_PASSWORD" | gh secret set KEY_PASSWORD -R "$GITHUB_REPOSITORY"
              printf '%s' "$KEY_ALIAS" | gh secret set KEY_ALIAS -R "$GITHUB_REPOSITORY"
              sha=$(keytool -list -v -keystore android/app/release.keystore -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" \
                | sed -nE 's/^[[:space:]]*SHA256: //p' | tr -d ':' | tr 'A-F' 'a-f')
              gh variable set SIGNING_CERT_SHA256 -R "$GITHUB_REPOSITORY" --body "$sha"
            else
              echo "::warning::NOVA_PAT not set; this key is not saved and the next build will use a different one"
            fi
          else
            echo "$KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore
          fi
          {
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyPassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "storeFile=app/release.keystore"
          } > android/key.properties

      - name: Set up Flutter
        run: |
          git clone --quiet --depth 1 --branch "$FLUTTER_VERSION" https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/flutter/bin/flutter" config --no-analytics
          "$RUNNER_TEMP/flutter/bin/flutter" --version

      # appambit_sdk_flutter 1.2.x ships AppambitSdkFlutterPlugin.kt (wrong case); flutter pub get rejects it on Linux.
      - name: Install dependencies
        run: |
          flutter precache
          dart pub get --enforce-lockfile
          find "${PUB_CACHE:-$HOME/.pub-cache}/hosted" \
            -path '*/appambit_sdk_flutter-*/android/src/main/kotlin/*/AppambitSdkFlutterPlugin.kt' |
          while read -r f; do
            mv -v "$f" "$(dirname "$f")/AppAmbitSdkFlutterPlugin.kt"
          done
          flutter pub get --enforce-lockfile

      - name: Build APKs
        run: |
          flutter build apk --release --flavor github

      - name: Collect APKs
        run: |
          version=$(sed -n 's/^version: *\([^+ ]*\).*/\1/p' pubspec.yaml)
          dir=build/app/outputs/flutter-apk
          out=build/beta
          mkdir -p "$out"
          ls -1 "$dir"/*.apk
          for f in "$dir"/*-release.apk; do
            name=$(basename "$f" .apk)
            case "$name" in
              app-github-release) abi=universal ;;
              *arm64-v8a*) abi=arm64-v8a ;;
              *armeabi-v7a*) abi=armeabi-v7a ;;
              *x86_64*) abi=x86_64 ;;
              *) continue ;;
            esac
            cp "$f" "$out/nova-player-v${version}-${abi}-offline-release.apk"
          done
          ls -la "$out"

      - uses: actions/upload-artifact@v7
        with:
          name: nova-player-apks
          path: build/beta/*.apk

      - name: Publish pre-release v1.0.0-beta
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=v1.0.0-beta
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --prerelease --target "$GITHUB_SHA" \
              --title "NOVA Player 1.0.0-beta" \
              --notes "First beta of NOVA Player. Install the arm64-v8a APK on most phones."
          fi
          gh release upload "$tag" build/beta/*.apk --clobber
