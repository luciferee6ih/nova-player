name: Import source

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import_source:
    name: Import source
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.NOVA_PAT }}

      - name: Download source archive from the source release
        run: |
          curl -fsSL \
            -o /tmp/nova-player-src.zip \
            "https://github.com/${GITHUB_REPOSITORY}/releases/download/source/nova-player-src.zip"
          unzip -l /tmp/nova-player-src.zip | head -20

      - name: Unpack archive and copy source into the repository
        run: |
          set -euo pipefail
          rm -rf /tmp/src && mkdir -p /tmp/src
          unzip -q /tmp/nova-player-src.zip -d /tmp/src
          ROOT="$(dirname "$(find /tmp/src -name pubspec.yaml -print -quit)")"
          echo "Source root: ${ROOT}"
          rm -rf "${ROOT}/.git"
          shopt -s dotglob nullglob
          cp -a "${ROOT}/." "${GITHUB_WORKSPACE}/"
          ls -a

      - name: Commit and push source to main
        run: |
          set -euo pipefail
          cd "${GITHUB_WORKSPACE}"
          git config user.name "luciferee6ih"
          git config user.email "the.luciferee@gmail.com"
          git add -A
          git commit -m "Import NOVA Player source" || echo "Nothing to commit"
          git push origin HEAD:main
