name: Real App Screenshots

# Manual only. Installs a released APK on an Android emulator, loads a few
# generated sample tracks, walks the main screens and saves real screenshots
# plus gfxinfo frame stats as an artifact.
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release whose universal APK to test'
        type: string
        default: 'v1.0.0'
      locale:
        description: 'App locale'
        type: string
        default: 'fa'

permissions:
  contents: read

jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Download APK
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
        run: |
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p '*universal*.apk' -O app.apk
          ls -la app.apk

      - name: Generate sample music
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
          mkdir -p music
          i=0
          for t in "Shab|Nova Ensemble|#3b1d5e" "Baran|Aras|#0f3b4a" "Midnight Drive|Lumen|#4a1020" \
                   "Daryaa|Setareh|#1d4a2a" "Glass City|Echo Park|#2b2b2b" "Sahar|Nima|#5a3a10" \
                   "Afterglow|Lumen|#10304a" "Panjereh|Aras|#3a103a"; do
            i=$((i+1))
            IFS='|' read -r title artist color <<< "$t"
            ffmpeg -loglevel error -f lavfi -i "color=c=${color}:s=600x600" \
              -f lavfi -i "gradients=s=600x600:c0=${color}:c1=white@0.3:x0=0:y0=0:x1=600:y1=600:d=1" \
              -filter_complex "[0][1]overlay,format=rgb24" -frames:v 1 "music/cover$i.png"
            freq=$((220 + i * 55))
            ffmpeg -loglevel error -f lavfi -i "sine=frequency=$freq:duration=$((150 + i * 17))" -i "music/cover$i.png" \
              -map 0:a -map 1:v -c:a libmp3lame -b:a 192k -c:v png -disposition:v attached_pic \
              -metadata title="$title" -metadata artist="$artist" -metadata album="$title" \
              -id3v2_version 3 "music/$(printf %02d $i) - $title.mp3"
          done
          rm music/*.png
          ls -la music

      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash .github/scripts/shots.sh ${{ inputs.locale }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: shots/
